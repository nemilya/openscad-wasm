<!DOCTYPE html>
<html>

<body>
    <pre id="status"></pre>

    <script type="module">
        import OpenScad from "./openscad.js";

        const statusEl = document.getElementById("status");

        function log(text) {
            console.log(text);
            statusEl.textContent += text + "\n";
        }

        function downloadFile(blob, fileName) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.append(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(link.href);
        }

        async function go() {
            statusEl.textContent = "";
            log("Creating instance...");
            const instance = await OpenScad({
                noInitialRun: true,
                print: (t) => log("[out] " + t),
                printErr: (t) => log("[err] " + t),
            });

            log("Rendering a cube...");
            instance.FS.writeFile("/input.scad", `cube(10);`);

            const exitCode = instance.callMain(["/input.scad", "-o", "/cube.stl"]);
            if (exitCode !== 0) {
                throw new Error(`openscad exited with code ${exitCode}`);
            }

            const output = instance.FS.readFile("/cube.stl");
            log(`Got ${output.length} bytes, downloading...`);

            downloadFile(new Blob([output], { type: "application/octet-stream" }), "cube.stl");
            log("Done.");
            return output.length;
        }

        go().catch((error) => {
            log(`Failed: ${error.message}`);
            console.error(error);
        });
    </script>
</body>

</html>
