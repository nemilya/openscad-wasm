<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenSCAD WASM — Heightmap from image (surface)</title>
    <style>
        :root {
            --bg: #14161a;
            --panel: #1c1f25;
            --panel-2: #22262e;
            --border: #2e333d;
            --text: #d6dae2;
            --muted: #8a92a0;
            --accent: #4f9cf9;
            --accent-hover: #6fb0fb;
            --error: #ff7b72;
            --ok: #7ee2a8;
            font-size: 15px;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
        header .sub { color: var(--muted); font-size: .85rem; }
        header .nav { margin-left: auto; font-size: .85rem; }
        header .nav a { color: var(--accent); text-decoration: none; }
        header .nav a:hover { color: var(--accent-hover); }

        main { flex: 1; display: flex; min-height: 0; }

        /* ---------- left: parameters ---------- */
        #side {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--panel);
            overflow-y: auto;
        }

        .row {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }

        button, select {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 12px;
            font: inherit;
            cursor: pointer;
        }

        button:hover:not(:disabled) { border-color: var(--accent); }
        button:disabled { opacity: .45; cursor: default; }

        #render {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
            font-weight: 600;
        }

        #render:hover:not(:disabled) { background: var(--accent-hover); }

        /* preview — the original image; the processed heightmap is shown
           as a size line (the relief itself is visible in 3D) */
        #preview {
            display: block;
            max-width: 100%;
            max-height: 160px;
            margin: 0 auto;
            object-fit: contain;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        #imginfo {
            flex: 1 1 100%;
            color: var(--muted);
            font-size: .78rem;
            text-align: center;
            user-select: none;
        }

        .field {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
        }

        .field label:first-child {
            flex: 0 0 46%;
            color: var(--muted);
            font-size: .85rem;
            cursor: pointer;
            user-select: none;
        }

        .field input[type="number"], .field select {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 8px;
            font: inherit;
        }

        .field .unit { color: var(--muted); font-size: .8rem; flex: 0 0 auto; }

        label.chk {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            font-size: .85rem;
            cursor: pointer;
            user-select: none;
        }

        details {
            border-bottom: 1px solid var(--border);
        }

        details summary {
            padding: 8px 10px;
            color: var(--muted);
            font-size: .85rem;
            cursor: pointer;
            user-select: none;
        }

        #code {
            margin: 0;
            padding: 8px 12px 12px;
            max-height: 220px;
            overflow: auto;
            color: #9fb0c2;
            font: 11.5px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
            white-space: pre;
            user-select: text; /* readable and copyable, but not editable */
        }

        #log {
            max-height: 140px;
            overflow: auto;
            margin: 0;
            padding: 8px 14px;
            color: var(--muted);
            font: 11.5px/1.45 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #log .err { color: var(--error); }
        #log .ok { color: var(--ok); }

        #view { flex: 1; position: relative; min-width: 0; }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            #side { width: 100%; min-width: 0; border-right: 0; border-bottom: 1px solid var(--border); }
            #view { min-height: 320px; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three.module.js",
                "three/addons/": "./vendor/"
            }
        }
    </script>
</head>

<body>
    <header>
        <h1>Heightmap from image → surface()</h1>
        <span class="sub">upload an image — a 3D model is built from it</span>
        <span class="nav"><a href="index.html">← STL Viewer</a></span>
    </header>

    <main>
        <div id="side">
            <div class="row">
                <button id="upload">Upload image…</button>
                <input type="file" id="file" accept="image/*" hidden>
                <span id="filename" style="color: var(--muted); font-size: .8rem;">smiley.png (built-in)</span>
            </div>
            <div class="row">
                <img id="preview" alt="source image">
                <span id="imginfo"></span>
            </div>

            <div class="field">
                <label for="mode">Contour</label>
                <select id="mode">
                    <option value="vector" selected>vector — vertical walls</option>
                    <option value="surface">heightmap — surface()</option>
                </select>
            </div>
            <div class="field">
                <label for="sizeX">Size X</label>
                <input type="number" id="sizeX" min="10" max="200" step="1" value="60">
                <span class="unit">mm</span>
            </div>
            <div class="field">
                <label for="relief">Relief height</label>
                <input type="number" id="relief" min="0.5" max="20" step="0.5" value="2">
                <span class="unit">mm</span>
            </div>
            <div class="field">
                <label for="base">Plate thickness</label>
                <input type="number" id="base" min="0" max="20" step="0.5" value="2">
                <span class="unit">mm</span>
            </div>
            <div class="field">
                <label for="plate">Plate shape</label>
                <select id="plate">
                    <option value="auto">fit artwork + margin</option>
                    <option value="rect" selected>rectangle (full image)</option>
                    <option value="circle">circle</option>
                </select>
            </div>
            <div class="field" id="row-margin">
                <label for="margin">Margin from artwork</label>
                <input type="number" id="margin" min="0" max="20" step="0.5" value="2">
                <span class="unit">mm</span>
            </div>
            <div class="field" id="row-plateY" style="display:none">
                <label for="plateY">Plate size Y</label>
                <input type="number" id="plateY" min="5" max="300" step="1" value="60">
                <span class="unit">mm</span>
            </div>
            <div class="field" id="row-plateD" style="display:none">
                <label for="plateD">Plate diameter</label>
                <input type="number" id="plateD" min="5" max="300" step="1" value="40">
                <span class="unit">mm</span>
            </div>
            <div class="field">
                <label for="resolution">Resolution</label>
                <select id="resolution">
                    <option value="256">256 px</option>
                    <option value="512">512 px</option>
                    <option value="768" selected>768 px</option>
                    <option value="1024">1024 px</option>
                </select>
            </div>
            <div class="field">
                <label for="blur">Smoothing</label>
                <select id="blur">
                    <option value="0">none</option>
                    <option value="1" selected>1 px</option>
                    <option value="2">2 px</option>
                    <option value="3">3 px</option>
                </select>
            </div>
            <div class="field">
                <label for="thicken">Line thickening</label>
                <input type="number" id="thicken" min="0" max="5" step="0.1" value="0">
                <span class="unit">mm</span>
            </div>
            <div class="row">
                <label class="chk">
                    <input type="checkbox" id="binary" checked>
                    binary contour (single height)
                </label>
                <label class="chk">
                    <input type="checkbox" id="soft" checked> soft edge
                </label>
            </div>
            <div class="field">
                <label for="threshold">Binarization threshold</label>
                <input type="number" id="threshold" min="1" max="99" step="1" value="50">
                <span class="unit">%</span>
            </div>
            <div class="row">
                <label class="chk">
                    <input type="checkbox" id="invert" checked> dark = relief (stamp)
                </label>
                <label class="chk"><input type="checkbox" id="wire"> wireframe</label>
                <label class="chk"><input type="checkbox" id="tint" checked> tint</label>
            </div>

            <div class="row">
                <button id="render" title="⌘↩ / Ctrl+Enter">Build 3D</button>
                <button id="download" disabled>Download STL</button>
            </div>

            <details>
                <summary>OpenSCAD code (generated, view only)</summary>
                <pre id="code"></pre>
            </details>

            <details id="logbox">
                <summary>Log (opens itself on error)</summary>
                <pre id="log"></pre>
            </details>
        </div>

        <div id="view"></div>
    </main>

    <script type="module">
        import { Viewer3D } from "./lib/viewer3d.js";
        import { runOpenSCAD } from "./lib/openscad-run.js";

        const $ = (id) => document.getElementById(id);
        const logEl = $("log"), codeEl = $("code"), previewEl = $("preview"),
            imginfoEl = $("imginfo"), filenameEl = $("filename"),
            renderBtn = $("render"), downloadBtn = $("download");

        /* ---------------- parameters ---------------- */

        // The default is a "stamp" with a vector contour: vertical walls
        // and a smooth outline (marching squares → SVG → linear_extrude).
        const params = {
            mode: "vector",
            sizeX: 60, relief: 2, base: 2,
            plate: "rect", margin: 2, plateY: 0, plateD: 40,
            resolution: 768, blur: 1, thicken: 0, // thickening in mm (0 = none)
            binary: true, threshold: 50, soft: true,
            invert: true,
        };
        let plateYTouched = false, plateDTouched = false; // manual size entry

        /* ---------------- log ---------------- */

        function log(text, cls) {
            if (cls === "err") $("logbox").open = true;
            const atEnd = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
            const span = document.createElement("span");
            if (cls) span.className = cls;
            span.textContent = text + "\n";
            logEl.append(span);
            if (atEnd) logEl.scrollTop = logEl.scrollHeight;
        }

        /* ---------------- 3D ---------------- */

        const viewer = new Viewer3D($("view"), {
            hintHtml: "Upload an image or press \"Build 3D\".<br>Left-drag — rotate, wheel — zoom.",
        });
        $("wire").addEventListener("change", (e) => { viewer.wireframe = e.target.checked; });
        $("tint").addEventListener("change", (e) => { viewer.tint = e.target.checked; });

        /* ---------------- image processing ---------------- */

        let bitmap = null;      // source image
        let pngBytes = null;    // processed heightmap (grayscale PNG)
        let pngDims = [0, 0];   // dimensions after processing
        let svgText = null;     // vector contour (SVG in mm)
        let svgDims = [0, 0];   // SVG extents, mm
        let svgInfo = "";       // contour stats for the caption
        let contentBox = null;  // artwork bbox in mm: {cx, cy, w, h}
        let busy = false, pending = false;
        let thickenPx = 0;    // effective thickening in grid pixels

        // Vector mode: threshold isoline (marching squares) → smoothing → SVG
        // in mm. linear_extrude walls are strictly vertical, the contour is
        // identical at any height — exactly what a 3D-printable stamp needs.
        function buildVectorResult(g, w, h) {
            // "engraving" (invert off): relief follows the light areas
            let f = params.invert ? g : g.map((v) => 255 - v);

            let contours;
            try {
                contours = traceContours(f, w, h, params.threshold * 2.55);
            } catch (error) {
                svgText = null;
                imginfoEl.textContent = "contour tracing error";
                log(String(error), "err");
                return;
            }
            if (!contours.length) {
                svgText = null;
                imginfoEl.textContent = "no contour found — try a different threshold";
                return;
            }

            const sizeY = params.sizeX * h / w;
            // smoothing (Chaikin) → simplification (RDP, 0.05 mm tolerance) — in mm
            const polys = contours
                .map((pts) => smoothClosed(pts, 2))
                .map((pts) => pts.map(([x, y]) => [x * params.sizeX / w, y * sizeY / h]))
                .map((pts) => simplifyClosed(pts, 0.05));
            // artwork bbox in mm — the plate size is fitted to it
            let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
            for (const poly of polys) {
                for (const [x, y] of poly) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
            contentBox = {
                cx: (minX + maxX) / 2, cy: (minY + maxY) / 2,
                w: maxX - minX, h: maxY - minY,
            };
            const subpaths = polys.map((poly) =>
                poly.map(([x, y]) => `${x.toFixed(3)} ${y.toFixed(3)}`));

            svgText = `<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${params.sizeX}mm" height="${sizeY.toFixed(3)}mm" viewBox="0 0 ${params.sizeX} ${sizeY.toFixed(3)}">
  <path fill="black" fill-rule="evenodd" d="${
                subpaths.map((p) => `M ${p[0]} L ${p.slice(1).join(" L ")} Z`).join(" ")}"/>
</svg>`;
            svgDims = [params.sizeX, sizeY];
            svgInfo = `${contours.length} shapes, ` +
                `${subpaths.reduce((n, p) => n + p.length, 0)} points`;
            imginfoEl.textContent =
                `source ${bitmap.width}×${bitmap.height} px → vector contour: ${svgInfo}` +
                (params.thicken > 0
                    ? `, thickened ${params.thicken} mm${thickenPx ? ` (≈${thickenPx}px)` : ""}`
                    : "") +
                (params.invert ? "" : " (light = relief)");
            render();
        }

        // Thicken dark lines: a min-filter (minimum blur) — a thin stroke
        // grows by r pixels and survives smoothing.
        function dilateDark(src, w, h, r) {
            if (r <= 0) return src;
            const tmp = new Uint8Array(src.length);
            const dst = new Uint8Array(src.length);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    let m = 255;
                    for (let d = -r; d <= r; d++) {
                        const xx = Math.min(w - 1, Math.max(0, x + d));
                        const v = src[y * w + xx];
                        if (v < m) m = v;
                    }
                    tmp[y * w + x] = m;
                }
            }
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    let m = 255;
                    for (let d = -r; d <= r; d++) {
                        const yy = Math.min(h - 1, Math.max(0, y + d));
                        const v = tmp[yy * w + x];
                        if (v < m) m = v;
                    }
                    dst[y * w + x] = m;
                }
            }
            return dst;
        }

        // Box blur (separable, sliding sum), 2 passes ≈ Gaussian.
        function boxBlur(src, w, h, r, passes = 2) {
            let a = src, b = new Uint8Array(src.length);
            const win = 2 * r + 1;
            for (let p = 0; p < passes; p++) {
                // horizontal pass a → b
                for (let y = 0; y < h; y++) {
                    let sum = src[y * w] * (r + 1);
                    for (let d = 1; d <= r; d++) sum += src[y * w + Math.min(w - 1, d)];
                    for (let x = 0; x < w; x++) {
                        b[y * w + x] = Math.round(sum / win);
                        sum += src[y * w + Math.min(w - 1, x + r + 1)] -
                               src[y * w + Math.max(0, x - r)];
                    }
                }
                // vertical pass b → a
                const t = a; a = b; b = t === src ? new Uint8Array(src.length) : t;
                for (let x = 0; x < w; x++) {
                    let sum = a[x] * (r + 1);
                    for (let d = 1; d <= r; d++) sum += a[Math.min(h - 1, d) * w + x];
                    for (let y = 0; y < h; y++) {
                        b[y * w + x] = Math.round(sum / win);
                        sum += a[Math.min(h - 1, y + r + 1) * w + x] -
                               a[Math.max(0, y - r) * w + x];
                    }
                }
                const t2 = a; a = b; b = t2;
            }
            return a;
        }

        // Closed-polyline smoothing (Chaikin): each vertex is replaced by
        // points at 1/4 and 3/4 of the adjacent segments.
        function smoothClosed(pts, iterations = 2) {
            for (let n = 0; n < iterations; n++) {
                const out = [];
                for (let i = 0; i < pts.length; i++) {
                    const a = pts[i], b = pts[(i + 1) % pts.length];
                    out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
                    out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
                }
                pts = out;
            }
            return pts;
        }

        // Closed-contour simplification (Ramer–Douglas–Peucker): drops points
        // deviating from the chord by less than eps. Needed after Chaikin
        // (which quadruples the point count) — the STL gets several times
        // smaller while the curve is visually identical at eps ≈ 0.05 mm.
        function simplifyClosed(pts, eps) {
            if (pts.length < 8) return pts;
            let i0 = 0, i1 = 0, minx = 1e18, maxx = -1e18;
            for (let i = 0; i < pts.length; i++) {
                if (pts[i][0] < minx) { minx = pts[i][0]; i0 = i; }
                if (pts[i][0] > maxx) { maxx = pts[i][0]; i1 = i; }
            }
            const part = (a, b) => {
                const arr = [];
                for (let i = a; i !== b; i = (i + 1) % pts.length) arr.push(pts[i]);
                arr.push(pts[b]);
                return arr;
            };
            const rdp = (p) => {
                const keep = new Uint8Array(p.length);
                keep[0] = keep[p.length - 1] = 1;
                const stack = [[0, p.length - 1]];
                while (stack.length) {
                    const [a, b] = stack.pop();
                    if (b - a < 2) continue;
                    const ax = p[a][0], ay = p[a][1];
                    const dx = p[b][0] - ax, dy = p[b][1] - ay;
                    const len = Math.hypot(dx, dy) || 1e-12;
                    let maxD = -1, idx = -1;
                    for (let i = a + 1; i < b; i++) {
                        const d = Math.abs(dx * (ay - p[i][1]) - (ax - p[i][0]) * dy) / len;
                        if (d > maxD) { maxD = d; idx = i; }
                    }
                    if (maxD > eps) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
                }
                return p.filter((_, i) => keep[i]);
            };
            // split the closed contour into two chains at the extreme points
            const p1 = rdp(part(i0, i1));
            const p2 = rdp(part(i1, i0));
            return [...p1.slice(0, -1), ...p2.slice(0, -1)];
        }

        // Marching squares: the isoline at level iso over the field v (pixels,
        // y down). The field is framed with a light border so that every
        // contour closes. Returns closed polylines in source-pixel coordinates
        // (subpixel accuracy — points are interpolated along cell edges).
        function traceContours(v0, w, h, iso) {
            const W = w + 2, H = h + 2;
            const v = new Uint8Array(W * H).fill(255);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) v[(y + 1) * W + x + 1] = v0[y * w + x];
            }

            const key = (p) => Math.round(p[0] * 8192) * 65537 + Math.round(p[1] * 8192);
            const byKey = new Map();
            const allSegs = [];
            const seg = (a, b) => {
                if (a[0] === b[0] && a[1] === b[1]) return;
                const s = [a, b];
                allSegs.push(s);
                for (const p of [a, b]) {
                    const k = key(p);
                    if (!byKey.has(k)) byKey.set(k, []);
                    byKey.get(k).push(s);
                }
            };
            const interp = (x0, y0, s0, x1, y1, s1) => {
                const t = (iso - s0) / (s1 - s0);
                return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t];
            };

            for (let y = 0; y < H - 1; y++) {
                for (let x = 0; x < W - 1; x++) {
                    const tl = v[y * W + x], tr = v[y * W + x + 1];
                    const br = v[(y + 1) * W + x + 1], bl = v[(y + 1) * W + x];
                    const idx = (tl < iso ? 8 : 0) | (tr < iso ? 4 : 0) |
                                (br < iso ? 2 : 0) | (bl < iso ? 1 : 0);
                    if (idx === 0 || idx === 15) continue;
                    const T = () => interp(x, y, tl, x + 1, y, tr);
                    const R = () => interp(x + 1, y, tr, x + 1, y + 1, br);
                    const B = () => interp(x, y + 1, bl, x + 1, y + 1, br);
                    const L = () => interp(x, y, tl, x, y + 1, bl);
                    const table = {
                        1: [[B, L]], 2: [[R, B]], 3: [[L, R]], 4: [[T, R]],
                        5: [[T, L], [R, B]], 6: [[T, B]], 7: [[T, L]],
                        8: [[T, L]], 9: [[T, B]], 10: [[T, R], [B, L]],
                        11: [[T, R]], 12: [[L, R]], 13: [[R, B]], 14: [[B, L]],
                    };
                    for (const [fa, fb] of table[idx]) seg(fa(), fb());
                }
            }

            // stitch segments into closed contours
            const used = new Set();
            const takeNext = (from) => {
                for (const s of byKey.get(key(from)) ?? []) {
                    if (used.has(s)) continue;
                    used.add(s);
                    return key(s[0]) === key(from) ? s[1] : s[0];
                }
                return null;
            };
            const contours = [];
            for (const s0 of allSegs) {
                if (used.has(s0)) continue;
                used.add(s0);
                const loop = [s0[0], s0[1]];
                let guard = allSegs.length;
                while (guard-- > 0) {
                    const next = takeNext(loop[loop.length - 1]);
                    if (!next) break;
                    const closed = key(next) === key(loop[0]);
                    if (!closed) loop.push(next);
                    if (closed) break;
                }
                if (loop.length >= 3) {
                    contours.push(loop.map(([x, y]) => [x - 1, y - 1])); // drop the border
                }
            }
            return contours;
        }


        // Turns the uploaded image into a relief: resize to resolution,
        // composite onto a white background, grayscale, then (all in JS,
        // deterministic): dark-line thickening → smoothing → threshold
        // (hard or with a soft edge — a soft edge gives a subpixel-smooth
        // contour at full height inside; surface() interpolates the grid
        // linearly) → inversion for the stamp (the scad keeps only positive
        // scales, see buildCode).
        function processImage() {
            if (!bitmap) return;
            const scale = params.resolution / Math.max(bitmap.width, bitmap.height);
            const w = Math.max(1, Math.round(bitmap.width * scale));
            const h = Math.max(1, Math.round(bitmap.height * scale));

            // auto-fill plate sizes (until the user edits them)
            const sizeY0 = params.sizeX * h / w;
            if (!plateYTouched) {
                params.plateY = Math.max(5, Math.round(sizeY0));
                $("plateY").value = params.plateY;
            }
            if (!plateDTouched) {
                params.plateD = Math.max(5, Math.round(Math.min(params.sizeX, sizeY0)));
                $("plateD").value = params.plateD;
            }

            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h); // transparency → white background
            ctx.drawImage(bitmap, 0, 0, w, h);

            const img = ctx.getImageData(0, 0, w, h);
            let g = new Uint8Array(w * h);
            for (let i = 0, p = 0; i < img.data.length; i += 4, p++) {
                g[p] = Math.round(
                    0.299 * img.data[i] + 0.587 * img.data[i + 1] + 0.114 * img.data[i + 2]);
            }

            // Thickening is specified in mm of the final model — convert to
            // grid pixels (square pixels: size_x/w mm on each axis).
            const mmPerPx = params.sizeX / w;
            thickenPx = params.thicken > 0
                ? Math.max(1, Math.min(32, Math.round(params.thicken / mmPerPx)))
                : 0;
            g = dilateDark(g, w, h, thickenPx);
            if (params.blur > 0) g = boxBlur(g, w, h, params.blur);

            if (params.mode === "vector") {
                buildVectorResult(g, w, h);
                return;
            }

            const thr = params.threshold * 2.55;
            const band = params.binary ? (params.soft ? 51 : 0) : 255;
            let bMinX = w, bMinY = h, bMaxX = -1, bMaxY = -1; // bbox of raised pixels
            for (let i = 0; i < g.length; i++) {
                let v;
                if (band <= 0) {
                    v = g[i] < thr ? 0 : 255;
                } else {
                    const t = (g[i] - (thr - band)) / (2 * band);
                    v = Math.round(255 * Math.min(1, Math.max(0, t)));
                }
                if (params.invert) v = 255 - v;
                img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
                if (v > 127) {
                    const x = i % w, y = (i / w) | 0;
                    if (x < bMinX) bMinX = x;
                    if (x > bMaxX) bMaxX = x;
                    if (y < bMinY) bMinY = y;
                    if (y > bMaxY) bMaxY = y;
                }
            }
            // artwork bbox in mm (half a pixel — to the grid cell size)
            const sizeY = params.sizeX * h / w;
            const mmX = (p) => (p + 0.5) * params.sizeX / w;
            const mmY = (p) => (p + 0.5) * sizeY / h;
            if (bMaxX >= 0) {
                const x0 = mmX(bMinX - 0.5), x1 = mmX(bMaxX + 0.5);
                const y0 = mmY(bMinY - 0.5), y1 = mmY(bMaxY + 0.5);
                contentBox = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
            } else {
                contentBox = { cx: params.sizeX / 2, cy: sizeY / 2, w: params.sizeX, h: sizeY };
            }
            ctx.putImageData(img, 0, 0);
            canvas.toBlob(async (blob) => {
                pngBytes = new Uint8Array(await blob.arrayBuffer());
                pngDims = [w, h];
                imginfoEl.textContent =
                    `source ${bitmap.width}×${bitmap.height} px → heightmap ${w}×${h} px` +
                    (params.thicken > 0
                        ? `, thickened ${params.thicken} mm${thickenPx ? ` (≈${thickenPx}px)` : ""}`
                        : "") +
                    (params.binary
                        ? `, binarized ${params.threshold}%${params.soft ? ", soft edge" : ""}`
                        : "") +
                    (params.invert ? ", inverted (dark up)" : "");
                render();
            }, "image/png");
        }

        let previewURL = null;

        async function loadImage(source, name) {
            try {
                bitmap = await createImageBitmap(source);
                filenameEl.textContent = name;
                plateYTouched = false;  // new image — reset plate sizes
                plateDTouched = false;
                // preview shows the original unscaled; the processed heightmap
                // is visible in 3D and in the size line under the preview
                if (previewURL) URL.revokeObjectURL(previewURL);
                previewURL = URL.createObjectURL(source);
                previewEl.src = previewURL;
                log(`image: ${name} (${bitmap.width}×${bitmap.height} px)`);
                processImage();
            } catch (error) {
                log("failed to read image: " + (error?.message ?? error), "err");
            }
        }

        $("upload").addEventListener("click", () => $("file").click());
        $("file").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file, file.name);
            e.target.value = "";
        });

        /* ---------------- code generation ---------------- */

        /* ---------------- base plate ---------------- */

        // Current model size along Y (mm): from the SVG in vector mode,
        // from the image aspect in surface mode.
        function modelSizeY() {
            return params.mode === "vector" && svgDims[1]
                ? svgDims[1]
                : params.sizeX * pngDims[1] / pngDims[0];
        }

        function plateYValue() {
            return plateYTouched ? params.plateY : Math.round(modelSizeY());
        }

        // Scad fragment for the plate: auto-cropped to the artwork,
        // a rectangle or a circle. The plate is centered on the image center
        // (as before), not on the artwork bounding box center.
        function plateCode() {
            const { w, h } = contentBox;
            const cx = params.sizeX / 2, cy = modelSizeY() / 2;
            if (params.plate === "circle") {
                return `    translate([${cx.toFixed(3)}, ${cy.toFixed(3)}, 0])\n` +
                    `        cylinder(d = ${params.plateD}, h = base_h, $fn = 128); // circular plate`;
            }
            const pw = params.plate === "auto" ? w + 2 * params.margin : params.sizeX;
            const ph = params.plate === "auto" ? h + 2 * params.margin : plateYValue();
            return `    translate([${(cx - pw / 2).toFixed(3)}, ${(cy - ph / 2).toFixed(3)}, 0])\n` +
                `        cube([${pw.toFixed(3)}, ${ph.toFixed(3)}, base_h]); // base plate`;
        }

        function plateInfo() {
            if (params.plate === "circle") return `plate ⌀${params.plateD} mm`;
            if (params.plate === "rect") {
                return `plate ${params.sizeX}×${plateYValue()} mm`;
            }
            return `auto plate ${(contentBox.w + 2 * params.margin).toFixed(1)}×` +
                `${(contentBox.h + 2 * params.margin).toFixed(1)} mm`;
        }

        function buildCode() {
            if (params.mode === "vector") {
                return `// Stamp from a vector contour (${svgInfo})
// Generated automatically by heightmap.html — parameters are set in the panel.

size_x   = ${params.sizeX};      // mm, extent along X (Y follows the image aspect)
size_y   = ${svgDims[1].toFixed(3)}; // mm
relief_h = ${params.relief};     // mm, relief height above the plate
base_h   = ${params.base};       // mm, flat plate thickness

union() {
    // flat base plate
${plateCode()}

    // contour — threshold isoline (marching squares, subpixel accuracy),
    // smoothed (Chaikin); walls are vertical over the full height, holes
    // come from fill-rule="evenodd" right in the SVG
    translate([0, 0, base_h])
        linear_extrude(height = relief_h)
            import("contour.svg", center = false);
}
`;
            }

            const [w, h] = pngDims;
            return `// Relief from an image (${w}×${h} px after processing)
// Generated automatically by heightmap.html — parameters are set in the panel.

size_x   = ${params.sizeX};      // mm, extent along X (Y follows the image aspect)
size_y   = size_x * ${h} / ${w};
relief_h = ${params.relief};     // mm, relief height above the plate
base_h   = ${params.base};       // mm, flat plate thickness

union() {
    // flat base plate
${plateCode()}

    // relief: 1 px = size_x/${w} mm; brightness 0..255 gives height 0..100 units.
    // ${params.invert
        ? `Stamp: the heightmap is inverted during processing${params.binary ? `, binarized (threshold ${params.threshold}%${params.soft ? ", soft edge" : ""})` : ""}${params.thicken > 0 ? `, lines thickened by ${params.thicken} mm` : ""} — dark lines rise to the full relief_h, the background lands flush with the plate.`
        : `Engraving: light areas rise${params.binary ? ` (binarized, threshold ${params.threshold}%${params.soft ? ", soft edge" : ""})` : ""}${params.thicken > 0 ? `, lines thickened by ${params.thicken} mm` : ""}, dark areas stay flush with the plate.`}
    translate([0, 0, base_h])
        scale([size_x / ${w}, size_y / ${h}, relief_h / 100])
            surface(file = "image.png", center = false, invert = false);
}
`;
        }

        /* ---------------- render ---------------- */

        let stlBlob = null;

        downloadBtn.addEventListener("click", () => {
            if (!stlBlob) return;
            const link = document.createElement("a");
            link.href = URL.createObjectURL(stlBlob);
            link.download = (filenameEl.textContent.replace(/\.[^.]*$/, "") || "heightmap") + ".stl";
            document.body.append(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(link.href);
        });

        async function render() {
            if (params.mode === "vector" ? !svgText : !pngBytes) return;
            if (busy) { pending = true; return; }
            busy = true;
            renderBtn.disabled = true;
            viewer.setBusy(true, "building relief…");
            try {
                const code = buildCode();
                codeEl.textContent = code; // view only: a <pre>, not editable

                // if the plate is smaller than the artwork, the relief overflows its edges
                if (contentBox && params.plate !== "auto") {
                    const fits = params.plate === "circle"
                        ? Math.hypot(contentBox.w, contentBox.h) <= params.plateD
                        : contentBox.w <= params.sizeX && contentBox.h <= plateYValue();
                    if (!fits) log("plate is smaller than the artwork — the relief will overflow its edges", "err");
                }

                const files = params.mode === "vector"
                    ? { "/contour.svg": new TextEncoder().encode(svgText) }
                    : { "/image.png": pngBytes };

                log("running openscad…");
                const { stl, ms } = await runOpenSCAD(code, { files, log });

                stlBlob = new Blob([stl], { type: "model/stl" });
                downloadBtn.disabled = false;
                viewer.showSTL(stl);
                log(`done: ${stl.length.toLocaleString("en-US")} bytes of STL in ${ms} ms ` +
                    `(${plateInfo()})`, "ok");
            } catch (error) {
                log("error: " + (error?.message ?? error), "err");
                console.error(error);
            } finally {
                busy = false;
                viewer.setBusy(false);
                renderBtn.disabled = false;
                if (pending) { pending = false; render(); }
            }
        }

        renderBtn.addEventListener("click", render);
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); render(); }
        });

        // Auto-rebuild on parameter changes (debounced).
        let debounceTimer;

        // In vector mode binarization/soft edge play no role — disable them;
        // plate fields are shown per the selected shape.
        function updateModeUI() {
            const vector = params.mode === "vector";
            $("binary").disabled = vector;
            $("soft").disabled = vector;
            $("row-margin").style.display = params.plate === "auto" ? "" : "none";
            $("row-plateY").style.display = params.plate === "rect" ? "" : "none";
            $("row-plateD").style.display = params.plate === "circle" ? "" : "none";
        }

        for (const id of ["mode", "sizeX", "relief", "base", "plate", "margin", "plateY",
                          "plateD", "resolution", "blur", "thicken",
                          "binary", "threshold", "soft", "invert"]) {
            $(id).addEventListener("input", () => {
                params.mode = $("mode").value;
                params.sizeX = +$("sizeX").value || params.sizeX;
                params.relief = +$("relief").value || params.relief;
                params.base = Math.max(0, +$("base").value || 0);
                params.plate = $("plate").value;
                params.margin = Math.max(0, Math.min(20, +$("margin").value || 0));
                if (document.activeElement === $("plateY")) {
                    params.plateY = Math.max(5, +$("plateY").value || 5);
                    plateYTouched = true;
                }
                if (document.activeElement === $("plateD")) {
                    params.plateD = Math.max(5, +$("plateD").value || 5);
                    plateDTouched = true;
                }
                params.resolution = +$("resolution").value;
                params.blur = +$("blur").value;
                params.thicken = Math.max(0, Math.min(5, +$("thicken").value || 0));
                params.binary = $("binary").checked;
                params.threshold = Math.min(99, Math.max(1, +$("threshold").value || 50));
                params.soft = $("soft").checked;
                params.invert = $("invert").checked;
                updateModeUI();
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(processImage, 500);
            });
        }
        updateModeUI();

        // Startup image — the built-in smiley, so the page works right away.
        fetch("./assets/smiley.png")
            .then((res) => res.ok ? res.blob() : Promise.reject(res.status))
            .then((blob) => loadImage(blob, "smiley.png (built-in)"))
            .catch(() => log("upload an image — the built-in example is unavailable"));
    </script>
</body>

</html>
