# Static server for the OpenSCAD WASM example page and its build artifacts.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The WASM binary is by far the largest asset; compress it on the fly.
    gzip on;
    gzip_comp_level 6;
    gzip_types application/wasm application/javascript text/css application/json;

    # Handy during development; drop for a real deployment.
    add_header Cache-Control "no-store";

    # nginx >= 1.21 already maps .wasm to application/wasm in mime.types,
    # which is required for WebAssembly streaming compilation.
}
